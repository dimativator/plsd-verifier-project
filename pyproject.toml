[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plsd-verifier-experiments"
version = "0.1.0"
description = "Repeated coding-agent evaluations with optional and instructed verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
agent = ["mini-swe-agent==2.4.6"]
report = ["matplotlib==3.11.2", "numpy==2.5.5"]
dev = ["ruff>=0.14,<1"]

[project.urls]
Repository = "https://github.com/dimativator/plsd-verifier-project"

[project.scripts]
plsd-analyze = "experiments.three_arm_analysis:main"
plsd-plot = "experiments.report:main"

[tool.setuptools.packages.find]
include = ["experiments*"]

[tool.setuptools.package-data]
experiments = ["CROSSHAIR_GUIDE.txt", "Dockerfile", ".dockerignore"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["experiments/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
